<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER OXFORD | Institute Management</title>
<style>
:root{--navy:#102744;--blue:#1d4ed8;--bg:#f3f6fb;--line:#dce4ef;--ink:#172338;--muted:#64748b;--white:#fff;--red:#b91c1c;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e8eef8;color:var(--navy)}button.danger{background:#fee2e2;color:var(--red)}button:disabled{opacity:.5}#login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 40px #10274418;width:min(420px,100%)}.brand{font-weight:800;color:var(--navy);font-size:25px}.brand-logo{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#fff;vertical-align:middle;margin-right:8px}.login-logo{display:block;width:110px;height:110px;object-fit:contain;margin:0 auto 12px;border-radius:50%}.sub,.hint,.status{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}.notice{padding:12px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.5;margin:14px 0}.error{color:var(--red);font-size:13px;margin-top:8px}#app{display:none;min-height:100vh}.topbar{height:62px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.topbar .brand{color:white;font-size:18px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}aside{background:white;border-right:1px solid var(--line);padding:12px;overflow:auto}nav button{display:block;width:100%;text-align:left;background:transparent;color:#334155;margin:3px 0}nav button.active,nav button:hover{background:#eaf1ff;color:var(--blue)}.main{padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.page-head h1{margin:0;font-size:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:7px;color:var(--navy)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:10px;border:1px solid var(--line);border-radius:8px;min-width:210px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf4;white-space:nowrap}th{background:#f8fafc;color:#475569}td.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}.modal-card{background:white;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.mobile-menu{display:none}.photo{width:48px;height:48px;object-fit:cover;border-radius:50%;background:#e2e8f0}.mini{font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}aside.open{display:block}.main{padding:13px}.mobile-menu{display:inline-block}.form-grid{grid-template-columns:1fr}.page-head h1{font-size:20px}}
</style></head><body>

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function err(id,msg){$(id).textContent=msg||'';}function wa(phone,msg){let n=String(phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;if(!n){alert('इस रिकॉर्ड में मोबाइल नंबर नहीं है।');return;}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');}
async function loadStudents(){const {data,error}=await supabase.from('students').select('*').order('full_name');if(error)throw error;students=data||[];}
async function loadStaff(){const {data,error}=await supabase.from('staff').select('*').order('full_name');if(error)throw error;staff=data||[];}
function nav(){ $('nav').innerHTML=Object.entries(modules).map(([k,m])=>`<button data-page="${k}" class="${current===k?'active':''}">${k==='dashboard'?'▦':'•'} &nbsp;${m.title}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;$('sidebar').classList.remove('open');render();});}
async function render(){nav();const m=modules[current];$('pageTitle').textContent=m.title;$('pageActions').innerHTML=current==='dashboard'?'':`<button id="addBtn">+ Add ${m.title}</button> <button class="secondary" id="exportBtn">Export CSV</button>`;if(current==='dashboard'){await dashboard();return;}$('content').innerHTML='<div class="panel">Loading…</div>';try{if(['students','fees','attendance','staff','certificates','results'].includes(current))await loadStudents();if(current==='staff')await loadStaff();const {data,error}=await supabase.from(m.table).select('*').order('created_at',{ascending:false}).limit(1000);if(error)throw error;cached=data||[];tableView(m,cached);$('addBtn').onclick=()=>openForm();$('exportBtn').onclick=()=>exportCSV(m,cached);}catch(e){$('content').innerHTML=`<div class="panel error">${esc(e.message)}<p class="hint">Database update SQL चलाएँ और फिर पेज reload करें।</p></div>`;}}
async function dashboard(){let counts={};for(const t of ['students','courses','fees','attendance','enquiries','staff']){const {count,error}=await supabase.from(t).select('*',{count:'exact',head:true});counts[t]=error?'—':count;}$('content').innerHTML=`<div class="cards">${[['Students',counts.students],['Courses',counts.courses],['Fee Payments',counts.fees],['Attendance',counts.attendance],['Enquiries',counts.enquiries],['Staff',counts.staff]].map(([n,v])=>`<div class="stat"><small>${n}</small><strong>${v??0}</strong></div>`).join('')}</div><div class="panel"><div style="display:flex;align-items:center;gap:14px"><img src="${LOGO_DATA}" style="width:78px;height:78px;object-fit:contain;border-radius:50%"><div><h3>Welcome to SUPER OXFORD ERP</h3><div class="mini">Institute of English Language · Haridwar</div></div></div><p>एक Student record को Student ID से Fees, Attendance, ID Card और Results से जोड़ा जाता है।</p><div class="notice">Student Admission में Parent WhatsApp Number एक बार सेव करें। Attendance में In Time/Out Time दर्ज करके Arrival या Departure Message बटन दबाएँ। हर विद्यार्थी के Parent को उसी के नंबर पर अलग संदेश खुलेगा। WhatsApp में अंतिम Send आपको दबाना होगा; Free wa.me लिंक अपने-आप बैकग्राउंड में संदेश नहीं भेजता।</div><p class="hint">Institute: ${INSTITUTE} · ${ADDRESS} · ${PHONE}</p></div>`;}
function tableView(m,rows){if(!rows.length){$('content').innerHTML='<div class="panel empty">कोई record नहीं है। + Add बटन से पहला record जोड़ें।</div>';return;}$('content').innerHTML=`<div class="panel"><div class="toolbar"><input id="searchBox" placeholder="Search records…"><span class="status">${rows.length} records</span></div><div class="table-wrap"><table><thead><tr>${m.cols.map(c=>`<th>${esc(c.replaceAll('_',' ').toUpperCase())}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tbody">${rows.map(r=>rowHTML(m,r)).join('')}</tbody></table></div></div>`;$('searchBox').oninput=e=>{const q=e.target.value.toLowerCase();$('tbody').innerHTML=rows.filter(r=>m.cols.some(c=>String(r[c]??'').toLowerCase().includes(q))).map(r=>rowHTML(m,r)).join('');bindActions(m);};bindActions(m);}
function rowHTML(m,r){let cells=m.cols.map(c=>`<td>${c==='photo_url'&&r[c]?`<img class="photo" src="${esc(r[c])}">`:esc(r[c])}</td>`).join('');let extra='';if(current==='students')extra=`<button class="secondary" data-card="${r.id}">ID Card</button><button style="background:#15803d" data-parentwa="${r.id}">Parent WhatsApp</button>`;if(current==='staff')extra=`<button class="secondary" data-staffcard="${r.id}">ID Card</button>`;if(current==='fees')extra=`<button class="secondary" data-receipt="${r.id}">Receipt</button><button style="background:#15803d" data-feewa="${r.id}">Parent Fee Reminder</button>`;if(current==='attendance')extra=`<button style="background:#15803d" data-arrival="${r.id}">Arrival Message</button><button style="background:#15803d" data-departure="${r.id}">Departure Message</button>`;if(current==='enquiries')extra=`<button class="secondary" data-enqwa="${r.id}">WhatsApp Follow-up</button>`;return `<tr>${cells}<td class="actions">${extra}<button class="secondary" data-edit="${r.id}">Edit</button><button class="danger" data-del="${r.id}">Delete</button></td></tr>`;}
function findStudentFor(r){return students.find(s=>String(s.id)===String(r.student_id)||String(s.admission_no||'')===String(r.admission_no||''));}
function bindActions(m){
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(cached.find(x=>String(x.id)===b.dataset.edit)));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRecord(m,b.dataset.del));
document.querySelectorAll('[data-card]').forEach(b=>b.onclick=async()=>{const s=cached.find(x=>String(x.id)===b.dataset.card);if(s)await studentCard(s);});
document.querySelectorAll('[data-staffcard]').forEach(b=>b.onclick=()=>staffCard(cached.find(x=>String(x.id)===b.dataset.staffcard)));
document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receipt(cached.find(x=>String(x.id)===b.dataset.receipt)));
document.querySelectorAll('[data-parentwa]').forEach(b=>b.onclick=()=>{const s=cached.find(x=>String(x.id)===b.dataset.parentwa);wa(s.parent_whatsapp,`नमस्ते ${s.parent_name||'अभिभावक जी'}, ${s.full_name} के संबंध में SUPER OXFORD INSTITUTE से संपर्क कर रहे हैं। धन्यवाद।`);});
document.querySelectorAll('[data-feewa]').forEach(b=>b.onclick=async()=>{const r=cached.find(x=>String(x.id)===b.dataset.feewa);const s=findStudentFor(r);if(!s){alert('इस फीस रिकॉर्ड से विद्यार्थी नहीं मिला।');return;}const {data}=await supabase.from('fees').select('amount').eq('student_id',s.id);const paid=(data||[]).reduce((a,x)=>a+Number(x.amount||0),0);const due=Math.max(0,Number(s.total_fee||0)-paid);wa(s.parent_whatsapp,`नमस्ते ${s.parent_name||'अभिभावक जी'}, ${s.full_name} की कुल फीस ₹${Number(s.total_fee||0).toFixed(2)}, जमा फीस ₹${paid.toFixed(2)} और बाकी फीस ₹${due.toFixed(2)} है। कृपया SUPER OXFORD में फीस जमा कराएँ। धन्यवाद।`);});
document.querySelectorAll('[data-arrival]').forEach(b=>b.onclick=()=>{const r=cached.find(x=>String(x.id)===b.dataset.arrival);const s=findStudentFor(r);if(!s){alert('इस Attendance रिकॉर्ड से विद्यार्थी नहीं मिला।');return;}if(!r.in_time){alert('पहले Attendance में In Time दर्ज करें।');return;}wa(s.parent_whatsapp,`नमस्ते ${s.parent_name||'अभिभावक जी'}, आपका बच्चा ${s.full_name} आज ${r.attendance_date||today()} को SUPER OXFORD Institute में ${r.in_time} बजे पहुँच गया है। धन्यवाद।`);});
document.querySelectorAll('[data-departure]').forEach(b=>b.onclick=()=>{const r=cached.find(x=>String(x.id)===b.dataset.departure);const s=findStudentFor(r);if(!s){alert('इस Attendance रिकॉर्ड से विद्यार्थी नहीं मिला।');return;}if(!r.out_time){alert('पहले Attendance में Out Time दर्ज करें।');return;}wa(s.parent_whatsapp,`नमस्ते ${s.parent_name||'अभिभावक जी'}, आपका बच्चा ${s.full_name} आज ${r.attendance_date||today()} को SUPER OXFORD Institute से ${r.out_time} बजे निकल गया है। धन्यवाद।`);});
document.querySelectorAll('[data-enqwa]').forEach(b=>b.onclick=()=>{const r=cached.find(x=>String(x.id)===b.dataset.enqwa);wa(r.mobile,`नमस्ते ${r.person_name}, SUPER OXFORD में ${r.course_interested||'कोर्स'} के लिए आपकी enquiry मिली थी। क्या आप admission के बारे में और जानकारी चाहते हैं? हम आपकी सहायता के लिए उपलब्ध हैं।`);});
}
function fieldControl(f,val){const [key,label,type='text',a,b]=f;const required=a===1||b===1;const opts=Array.isArray(a)?a:(Array.isArray(b)?b:[]);let req=required?'required':'';if(type==='student'){return `<select id="f_${key}" ${req}><option value="">Select Student</option>${students.map(s=>`<option value="${s.id}" ${String(val)===String(s.id)?'selected':''}>${esc(s.admission_no)} - ${esc(s.full_name)}</option>`).join('')}</select>`;}if(type==='course'){return `<select id="f_${key}"><option value="">Select Course</option>${courseCache.map(c=>`<option value="${esc(c.id)}" ${String(val)===String(c.id)?'selected':''}>${esc(c.course_name)}</option>`).join('')}</select>`;}if(type==='file')return `<input id="f_${key}" type="file" accept="image/png,image/jpeg,image/webp">${val?`<div class="mini">Current photo saved</div>`:''}`;if(type==='select')return `<select id="f_${key}" ${req}>${(opts||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(type==='textarea')return `<textarea id="f_${key}" rows="3" ${req}>${esc(val)}</textarea>`;return `<input id="f_${key}" type="${type}" value="${esc(val)}" ${req}>`;}
let courseCache=[];
async function openForm(record){editingId=record?.id??null;try{if(['students','fees','attendance','staff','certificates','results'].includes(current))await loadStudents();if(current==='students'){const {data}=await supabase.from('courses').select('id,course_name').order('course_name');courseCache=data||[];}if(current==='fees'||current==='attendance'){const {data}=await supabase.from('students').select('*').eq('status','Active').order('full_name');students=data||[];}const m=modules[current];$('modalTitle').textContent=(editingId?'Edit ':'Add ')+m.title;$('formFields').innerHTML=m.fields.map(f=>`<div class="field"><label>${esc(f[1])}${(f[3]===1||f[4]===1)?' *':''}</label>${fieldControl(f,record?.[f[0]]??(f[0].endsWith('_date')||f[0]==='admission_date'?today():''))}</div>`).join('');if(current==='fees'){$('f_student_id').onchange=()=>fillStudentFields('fees');}if(current==='attendance')$('f_student_id').onchange=()=>fillStudentFields('attendance');err('formError','');$('modal').classList.add('open');}catch(e){alert(e.message);}}
function fillStudentFields(kind){let s=students.find(x=>String(x.id)===$('f_student_id').value);if(!s)return;}
async function uploadPhoto(file,folder){if(!file)return null;if(file.size>3*1024*1024)throw new Error('Photo 3 MB से छोटी होनी चाहिए।');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${folder}/${crypto.randomUUID()}.${ext}`;const {error}=await supabase.storage.from('institute-photos').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return supabase.storage.from('institute-photos').getPublicUrl(path).data.publicUrl;}
$('recordForm').onsubmit=async e=>{e.preventDefault();const m=modules[current],obj={};$('saveBtn').disabled=true;try{const {data:authData,error:authError}=await supabase.auth.getUser();if(authError)throw authError;if(!authData?.user)throw new Error('आपका Supabase Login session नहीं मिला। Logout करके उसी registered Email और Password से दोबारा Login करें। Student record सुरक्षित रखने के लिए anonymous insert बंद है।');for(const [key,label,type='text'] of m.fields){if(type==='file')continue;let v=$('f_'+key)?.value??'';if(type==='number')v=v===''?null:Number(v);if(type==='select'&&key==='is_published')v=v==='true';obj[key]=v===''?null:v;}
if(['fees','attendance','certificates','results'].includes(current)&&obj.student_id){const s=students.find(x=>String(x.id)===String(obj.student_id));if(s){obj.student_name=s.full_name;obj.admission_no=s.admission_no;if(current==='fees'&&!obj.receipt_no)obj.receipt_no='SO-'+Date.now();}}
if(current==='students'&&!obj.admission_no)obj.admission_no='SO-'+Date.now();if(current==='staff'&&!obj.employee_id)obj.employee_id='ST-'+Date.now();
if(current==='students'||current==='staff'){const f=$('f_photo').files[0];if(f)obj.photo_url=await uploadPhoto(f,current);}
let req=editingId?supabase.from(m.table).update(obj).eq('id',editingId):supabase.from(m.table).insert(obj);const {error}=await req;if(error)throw new Error('Database: '+error.message+(error.code?' | Code: '+error.code:'')+(error.details?' | Details: '+error.details:''));closeModal();await render();}catch(ex){err('formError',ex.message||String(ex));}finally{$('saveBtn').disabled=false;}};
async function removeRecord(m,id){if(!confirm('क्या आप यह record delete करना चाहते हैं?'))return;const {error}=await supabase.from(m.table).delete().eq('id',id);if(error)alert(error.message);else render();}
function closeModal(){$('modal').classList.remove('open');$('recordForm').reset();editingId=null;}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
function printDoc(title,body){const w=window.open('','_blank');if(!w){alert('Popup allow करें, फिर दोबारा कोशिश करें।');return;}w.document.write(`<!doctype html><html><head><title>${esc(title)}</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:24px;color:#172338}.card{border:2px solid #16365c;border-radius:12px;padding:20px;max-width:650px;margin:20px auto}.head{text-align:center;border-bottom:2px solid #16365c;padding-bottom:10px}.head h2{margin:4px}.photo{width:110px;height:130px;object-fit:cover;border:1px solid #999}.row{display:flex;gap:18px;align-items:center;margin:18px 0}.line{padding:7px 0;border-bottom:1px solid #ddd}.btn{margin:12px;padding:10px 18px}@media print{.btn{display:none}body{padding:0}}</style></head><body>${body}<button class="btn" onclick="window.print()">Print / Save PDF</button></body></html>`);w.document.close();}
async function studentCard(s){let courseName=s.course_name||'';if(s.course_id){const {data,error}=await supabase.from('courses').select('course_name').eq('id',s.course_id).maybeSingle();if(!error&&data?.course_name)courseName=data.course_name;}if(!courseName)courseName=s.course_id||'Not Assigned';printDoc('Student ID Card',`<div class="card"><div class="head"><img src="${LOGO_DATA}" style="width:70px;height:70px;object-fit:contain"><h2>${INSTITUTE}</h2><div>${ADDRESS} · ${PHONE}</div><b>STUDENT ID CARD</b></div><div class="row">${s.photo_url?`<img class="photo" src="${esc(s.photo_url)}">`:'<div class="photo"></div>'}<div><h2>${esc(s.full_name)}</h2><div class="line">Admission No: ${esc(s.admission_no)}</div><div class="line">Father: ${esc(s.father_name)}</div><div class="line">Course: ${esc(courseName)}</div><div class="line">Mobile: ${esc(s.mobile)}</div><div class="line">Admission: ${esc(s.admission_date)}</div></div></div></div>`);}
function staffCard(s){printDoc('Staff ID Card',`<div class="card"><div class="head"><img src="${LOGO_DATA}" style="width:70px;height:70px;object-fit:contain"><h2>${INSTITUTE}</h2><div>${ADDRESS} · ${PHONE}</div><b>STAFF ID CARD</b></div><div class="row">${s.photo_url?`<img class="photo" src="${esc(s.photo_url)}">`:'<div class="photo"></div>'}<div><h2>${esc(s.full_name)}</h2><div class="line">Employee ID: ${esc(s.employee_id)}</div><div class="line">Designation: ${esc(s.designation)}</div><div class="line">Department: ${esc(s.department)}</div><div class="line">Mobile: ${esc(s.mobile)}</div><div class="line">Joining: ${esc(s.joining_date)}</div></div></div></div>`);}
function receipt(r){printDoc('Fees Receipt',`<div class="card"><div class="head"><img src="${LOGO_DATA}" style="width:70px;height:70px;object-fit:contain"><h2>${INSTITUTE}</h2><div>${ADDRESS} · ${PHONE}</div><h3>FEES RECEIPT</h3></div><div class="line">Receipt No: ${esc(r.receipt_no)}</div><div class="line">Student: ${esc(r.student_name)}</div><div class="line">Admission No: ${esc(r.admission_no)}</div><div class="line">Payment Date: ${esc(r.payment_date)}</div><div class="line">Amount Paid: ₹${esc(r.amount)}</div><div class="line">Payment Mode: ${esc(r.payment_mode)}</div><div class="line">Remarks: ${esc(r.remarks)}</div><p style="text-align:right;margin-top:35px">Authorized Signature</p></div>`);}
function exportCSV(m,rows){if(!rows.length){alert('कोई record नहीं है।');return;}const csv=[m.cols.join(','),...rows.map(r=>m.cols.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=m.table+'.csv';a.click();URL.revokeObjectURL(a.href);}
$('loginBtn').onclick=async()=>{err('loginError','');if(!configured){err('loginError','index.html में अपनी Supabase Project URL और Publishable Key भरें।');return;}const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){err('loginError',error.message);return;}if(!data?.session||!data?.user){err('loginError','Login सफल नहीं हुआ: Supabase authenticated session नहीं मिला।');return;}showApp();};
// Secure password change: verify current password, then update Supabase Auth password.
$('changePasswordBtn').onclick=()=>{$('changePasswordForm').reset();$('passwordChangeMessage').textContent='';$('passwordModal').classList.add('open');};
$('closePasswordModal').onclick=$('cancelPasswordChange').onclick=()=>{$('passwordModal').classList.remove('open');};
$('changePasswordForm').onsubmit=async e=>{e.preventDefault();const currentPassword=$('currentPassword').value,newPassword=$('newPassword').value,confirmPassword=$('confirmNewPassword').value;const msg=$('passwordChangeMessage');const btn=$('changePasswordSubmit');msg.textContent='';if(newPassword.length<8){msg.textContent='New password कम से कम 8 characters का रखें।';return;}if(newPassword!==confirmPassword){msg.textContent='New Password और Confirm New Password एक जैसे नहीं हैं।';return;}if(currentPassword===newPassword){msg.textContent='New Password, Current Password से अलग रखें।';return;}btn.disabled=true;btn.textContent='Updating...';try{const {data:userData,error:userError}=await supabase.auth.getUser();if(userError||!userData?.user?.email)throw userError||new Error('Login user नहीं मिला।');const {error:verifyError}=await supabase.auth.signInWithPassword({email:userData.user.email,password:currentPassword});if(verifyError)throw new Error('Current Password सही नहीं है।');const {error:updateError}=await supabase.auth.updateUser({password:newPassword});if(updateError)throw updateError;msg.style.color='#15803d';msg.textContent='Password successfully changed. अब अगले Login में नया Password इस्तेमाल करें।';$('changePasswordForm').reset();}catch(ex){msg.style.color='#b91c1c';msg.textContent=ex.message||'Password change नहीं हो पाया।';}finally{btn.disabled=false;btn.textContent='Update Password';}};
$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();$('app').style.display='none';$('login').style.display='grid';};function showApp(){$('login').style.display='none';$('app').style.display='block';supabase.auth.getUser().then(({data})=>$('userLabel').textContent=data.user?.email||'Admin');current='dashboard';render();}if(configured){const {data:{session}}=await supabase.auth.getSession();if(session)showApp();}
</script></body></html>
