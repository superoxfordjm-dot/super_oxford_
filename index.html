<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER OXFORD | Institute Management</title>
<style>
:root{--navy:#102744;--blue:#1d4ed8;--bg:#f3f6fb;--line:#dce4ef;--ink:#172338;--muted:#64748b;--white:#fff;--red:#b91c1c;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e8eef8;color:var(--navy)}button.danger{background:#fee2e2;color:var(--red)}button:disabled{opacity:.5}#login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 40px #10274418;width:min(420px,100%)}.brand{font-weight:800;color:var(--navy);font-size:25px}.sub,.hint,.status{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}.notice{padding:12px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.5;margin:14px 0}.error{color:var(--red);font-size:13px;margin-top:8px}#app{display:none;min-height:100vh}.topbar{height:62px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.topbar .brand{color:white;font-size:18px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}aside{background:white;border-right:1px solid var(--line);padding:12px;overflow:auto}nav button{display:block;width:100%;text-align:left;background:transparent;color:#334155;margin:3px 0}nav button.active,nav button:hover{background:#eaf1ff;color:var(--blue)}.main{padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.page-head h1{margin:0;font-size:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:26px;margin-top:7px;color:var(--navy)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:10px;border:1px solid var(--line);border-radius:8px;min-width:210px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf4;white-space:nowrap}th{background:#f8fafc;color:#475569}td.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal.open{display:flex}.modal-card{background:white;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.mobile-menu{display:none}.photo{width:48px;height:48px;object-fit:cover;border-radius:50%;background:#e2e8f0}.mini{font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}aside.open{display:block}.main{padding:13px}.mobile-menu{display:inline-block}.form-grid{grid-template-columns:1fr}.page-head h1{font-size:20px}}
</style></head><body>
<section id="login"><div class="login-card"><div class="brand">SUPER OXFORD</div><div class="sub">Institute of English Language · Management Portal</div><div class="notice">Admin login Supabase Auth से होगा। अपनी मौजूदा Project URL और Publishable Key नीचे कोड में सुरक्षित रूप से सेट करें।</div><div class="field"><label>Admin Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" style="width:100%">Login</button><div id="loginError" class="error"></div></div></section>
<div id="app"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="secondary mobile-menu" id="menuBtn">☰</button><div class="brand">SUPER OXFORD <span style="font-size:12px;font-weight:400">Management</span></div></div><div style="display:flex;align-items:center;gap:10px"><span id="userLabel" class="status" style="color:#dbeafe"></span><button class="secondary" id="logoutBtn">Logout</button></div></header><div class="layout"><aside id="sidebar"><nav id="nav"></nav></aside><main class="main"><div class="page-head"><div><h1 id="pageTitle">Dashboard</h1><div class="status">Institute of English Language · Haridwar</div></div><div id="pageActions"></div></div><div id="content"></div></main></div></div>
<div class="modal" id="modal"><div class="modal-card"><div class="page-head"><h2 id="modalTitle" style="margin:0;font-size:19px">Add Record</h2><button class="secondary" id="closeModal">✕</button></div><form id="recordForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button type="submit" id="saveBtn">Save Record</button></div><div id="formError" class="error"></div></form></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// IMPORTANT: नीचे अपनी मौजूदा Live Website वाली Project URL और Publishable Key ही डालें। Secret/service_role key कभी न डालें।
const SUPABASE_URL='https://jlzidyrenpoprbhpvhns.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_rNvE3l3sQzgHd_x4RxjMFA_2DYleZ6l';
const INSTITUTE='SUPER OXFORD INSTITUTE OF ENGLISH LANGUAGE';
const ADDRESS='Raj Rana Complex, Jamalpur Kalan, Haridwar';
const PHONE='';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
const supabase=configured?createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id);let current='dashboard',editingId=null,cached=[],students=[],staff=[];
const today=()=>new Date().toISOString().slice(0,10);
const modules={
 dashboard:{title:'Dashboard'},
 students:{title:'Students',table:'students',fields:[['admission_no','Admission No','text',1],['full_name','Student Name','text',1],['father_name','Father Name'],['mother_name','Mother Name'],['mobile','Mobile','tel'],['email','Email','email'],['dob','Date of Birth','date'],['gender','Gender','select',['Male','Female','Other']],['address','Full Address','textarea'],['city','City'],['state','State'],['pin_code','PIN Code'],['course_id','Course','course'],['admission_date','Admission Date','date'],['total_fee','Total Fees','number'],['status','Status','select',['Active','Inactive','Completed']],['photo','Student Photo','file']],cols:['admission_no','full_name','mobile','course_id','status'],search:['admission_no','full_name','father_name','mobile']},
 courses:{title:'Courses',table:'courses',fields:[['course_name','Course Name','text',1],['duration','Duration'],['fee_amount','Course Fee','number'],['description','Description','textarea']],cols:['course_name','duration','fee_amount']},
 fees:{title:'Fees & Receipts',table:'fees',fields:[['student_id','Select Student','student',1],['amount','Paid Amount','number',1],['payment_date','Payment Date','date'],['payment_mode','Payment Mode','select',['Cash','UPI','Bank Transfer','Online','Other']],['receipt_no','Receipt No'],['remarks','Remarks','textarea']],cols:['student_name','admission_no','amount','payment_date','payment_mode','receipt_no']},
 attendance:{title:'Attendance',table:'attendance',fields:[['student_id','Select Student','student',1],['attendance_date','Date','date',1],['status','Status','select',['Present','Absent','Late','Leave'],1],['in_time','In Time','time'],['out_time','Out Time','time'],['remarks','Remarks','textarea']],cols:['student_name','admission_no','attendance_date','status','in_time','out_time']},
 enquiries:{title:'Enquiry & Follow-up',table:'enquiries',fields:[['person_name','Name','text',1],['mobile','Mobile','tel',1],['course_interested','Course Interested'],['enquiry_date','Enquiry Date','date'],['status','Status','select',['New','Follow-up','Joined','Not Interested']],['follow_up_date','Follow-up Date','date'],['notes','Notes','textarea']],cols:['person_name','mobile','course_interested','status','follow_up_date']},
 staff:{title:'Staff Management',table:'staff',fields:[['employee_id','Employee ID'],['full_name','Staff Name','text',1],['mobile','Mobile','tel'],['email','Email','email'],['designation','Designation'],['department','Department'],['joining_date','Joining Date','date'],['salary','Salary','number'],['address','Full Address','textarea'],['city','City'],['state','State'],['pin_code','PIN Code'],['status','Status','select',['Active','Inactive']],['photo','Staff Photo','file']],cols:['employee_id','full_name','mobile','designation','joining_date','status']},
 transactions:{title:'Income & Expenses',table:'transactions',fields:[['entry_type','Type','select',['Income','Expense'],1],['category','Category','text',1],['amount','Amount','number',1],['entry_date','Date','date',1],['payment_mode','Payment Mode','select',['Cash','UPI','Bank Transfer','Other']],['description','Description','textarea']],cols:['entry_type','category','amount','entry_date','payment_mode']},
 exams:{title:'Exams',table:'exams',fields:[['exam_name','Exam Name','text',1],['course_name','Course'],['exam_date','Exam Date','date'],['total_marks','Total Marks','number'],['passing_marks','Passing Marks','number'],['description','Description','textarea']],cols:['exam_name','course_name','exam_date','total_marks','passing_marks']},
 certificates:{title:'Certificates',table:'certificates',fields:[['student_id','Select Student','student'],['certificate_no','Certificate No','text',1],['course_name','Course'],['issue_date','Issue Date','date'],['status','Status','select',['Issued','Pending','Cancelled']]],cols:['student_name','admission_no','certificate_no','course_name','issue_date','status']},
 tests:{title:'Online Tests',table:'tests',fields:[['test_name','Test Name','text',1],['course_name','Course'],['total_questions','Total Questions','number'],['duration_minutes','Duration Minutes','number'],['is_published','Published','select',['true','false']],['max_attempts','Max Attempts','number']],cols:['test_name','course_name','total_questions','duration_minutes','is_published']},
 questions:{title:'Test Questions',table:'test_questions',fields:[['test_id','Test ID','text',1],['question_text','Question','textarea',1],['option_a','Option A'],['option_b','Option B'],['option_c','Option C'],['option_d','Option D'],['correct_option','Correct Option','select',['A','B','C','D'],1],['marks','Marks','number']],cols:['test_id','question_text','correct_option','marks']},
 results:{title:'Exam Results',table:'exam_results',fields:[['student_id','Select Student','student'],['exam_name','Exam Name'],['marks_obtained','Marks Obtained','number'],['total_marks','Total Marks','number'],['result_date','Result Date','date']],cols:['student_name','admission_no','exam_name','marks_obtained','total_marks','result_date']},
 library:{title:'Library',table:'library_books',fields:[['book_title','Book Title','text',1],['author','Author'],['category','Category'],['book_code','Book Code'],['total_copies','Total Copies','number'],['available_copies','Available Copies','number']],cols:['book_title','author','category','book_code','available_copies']}
};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function err(id,msg){$(id).textContent=msg||'';}function wa(phone,msg){let n=String(phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;if(!n){alert('इस रिकॉर्ड में मोबाइल नंबर नहीं है।');return;}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');}
async function loadStudents(){const {data,error}=await supabase.from('students').select('*').order('full_name');if(error)throw error;students=data||[];}
async function loadStaff(){const {data,error}=await supabase.from('staff').select('*').order('full_name');if(error)throw error;staff=data||[];}
function nav(){ $('nav').innerHTML=Object.entries(modules).map(([k,m])=>`<button data-page="${k}" class="${current===k?'active':''}">${k==='dashboard'?'▦':'•'} &nbsp;${m.title}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;$('sidebar').classList.remove('open');render();});}
async function render(){nav();const m=modules[current];$('pageTitle').textContent=m.title;$('pageActions').innerHTML=current==='dashboard'?'':`<button id="addBtn">+ Add ${m.title}</button> <button class="secondary" id="exportBtn">Export CSV</button>`;if(current==='dashboard'){await dashboard();return;}$('content').innerHTML='<div class="panel">Loading…</div>';try{if(['students','fees','attendance','staff','certificates','results'].includes(current))await loadStudents();if(current==='staff')await loadStaff();const {data,error}=await supabase.from(m.table).select('*').order('created_at',{ascending:false}).limit(1000);if(error)throw error;cached=data||[];tableView(m,cached);$('addBtn').onclick=()=>openForm();$('exportBtn').onclick=()=>exportCSV(m,cached);}catch(e){$('content').innerHTML=`<div class="panel error">${esc(e.message)}<p class="hint">Database update SQL चलाएँ और फिर पेज reload करें।</p></div>`;}}
async function dashboard(){let counts={};for(const t of ['students','courses','fees','attendance','enquiries','staff']){const {count,error}=await supabase.from(t).select('*',{count:'exact',head:true});counts[t]=error?'—':count;}$('content').innerHTML=`<div class="cards">${[['Students',counts.students],['Courses',counts.courses],['Fee Payments',counts.fees],['Attendance',counts.attendance],['Enquiries',counts.enquiries],['Staff',counts.staff]].map(([n,v])=>`<div class="stat"><small>${n}</small><strong>${v??0}</strong></div>`).join('')}</div><div class="panel"><h3>Welcome to SUPER OXFORD</h3><p>एक Student record को Student ID से Fees, Attendance, ID Card और Results से जोड़ा जाता है।</p><div class="notice">WhatsApp संदेश भेजने के लिए WhatsApp खुलेगा; संदेश देखकर Send दबाएँ। Free web link से बिना पुष्टि के automatic WhatsApp sending संभव नहीं है।</div><p class="hint">Institute: ${INSTITUTE} · ${ADDRESS} · ${PHONE}</p></div>`;}
function tableView(m,rows){if(!rows.length){$('content').innerHTML='<div class="panel empty">कोई record नहीं है। + Add बटन से पहला record जोड़ें।</div>';return;}$('content').innerHTML=`<div class="panel"><div class="toolbar"><input id="searchBox" placeholder="Search records…"><span class="status">${rows.length} records</span></div><div class="table-wrap"><table><thead><tr>${m.cols.map(c=>`<th>${esc(c.replaceAll('_',' ').toUpperCase())}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tbody">${rows.map(r=>rowHTML(m,r)).join('')}</tbody></table></div></div>`;$('searchBox').oninput=e=>{const q=e.target.value.toLowerCase();$('tbody').innerHTML=rows.filter(r=>m.cols.some(c=>String(r[c]??'').toLowerCase().includes(q))).map(r=>rowHTML(m,r)).join('');bindActions(m);};bindActions(m);}
function rowHTML(m,r){let cells=m.cols.map(c=>`<td>${c==='photo_url'&&r[c]?`<img class="photo" src="${esc(r[c])}">`:esc(r[c])}</td>`).join('');let extra='';if(current==='students')extra=`<button class="secondary" data-card="${r.id}">ID Card</button>`;if(current==='staff')extra=`<button class="secondary" data-staffcard="${r.id}">ID Card</button>`;if(current==='fees')extra=`<button class="secondary" data-receipt="${r.id}">Receipt</button><button class="secondary" data-feewa="${r.id}">WhatsApp Reminder</button>`;if(current==='enquiries')extra=`<button class="secondary" data-enqwa="${r.id}">WhatsApp Follow-up</button>`;return `<tr>${cells}<td class="actions">${extra}<button class="secondary" data-edit="${r.id}">Edit</button><button class="danger" data-del="${r.id}">Delete</button></td></tr>`;}
function bindActions(m){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(cached.find(x=>String(x.id)===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeRecord(m,b.dataset.del));document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>studentCard(cached.find(x=>String(x.id)===b.dataset.card)));document.querySelectorAll('[data-staffcard]').forEach(b=>b.onclick=()=>staffCard(cached.find(x=>String(x.id)===b.dataset.staffcard)));document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receipt(cached.find(x=>String(x.id)===b.dataset.receipt)));document.querySelectorAll('[data-feewa]').forEach(b=>b.onclick=()=>{const r=cached.find(x=>String(x.id)===b.dataset.feewa);wa(r.mobile,`नमस्ते ${r.student_name}, आपकी फीस में ₹${r.amount} का भुगतान दर्ज है। कृपया शेष फीस के लिए SUPER OXFORD से संपर्क करें। धन्यवाद।`);});document.querySelectorAll('[data-enqwa]').forEach(b=>b.onclick=()=>{const r=cached.find(x=>String(x.id)===b.dataset.enqwa);wa(r.mobile,`नमस्ते ${r.person_name}, SUPER OXFORD में ${r.course_interested||'कोर्स'} के लिए आपकी enquiry मिली थी। क्या आप admission के बारे में और जानकारी चाहते हैं? हम आपकी सहायता के लिए उपलब्ध हैं।`);});}
function fieldControl(f,val){const [key,label,type='text',a,b]=f;const required=a===1||b===1;const opts=Array.isArray(a)?a:(Array.isArray(b)?b:[]);let req=required?'required':'';if(type==='student'){return `<select id="f_${key}" ${req}><option value="">Select Student</option>${students.map(s=>`<option value="${s.id}" ${String(val)===String(s.id)?'selected':''}>${esc(s.admission_no)} - ${esc(s.full_name)}</option>`).join('')}</select>`;}if(type==='course'){return `<select id="f_${key}"><option value="">Select Course</option>${courseCache.map(c=>`<option value="${esc(c.id)}" ${String(val)===String(c.id)?'selected':''}>${esc(c.course_name)}</option>`).join('')}</select>`;}if(type==='file')return `<input id="f_${key}" type="file" accept="image/png,image/jpeg,image/webp">${val?`<div class="mini">Current photo saved</div>`:''}`;if(type==='select')return `<select id="f_${key}" ${req}>${(opts||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(type==='textarea')return `<textarea id="f_${key}" rows="3" ${req}>${esc(val)}</textarea>`;return `<input id="f_${key}" type="${type}" value="${esc(val)}" ${req}>`;}
let courseCache=[];
async function openForm(record){editingId=record?.id??null;try{if(['students','fees','attendance','staff','certificates','results'].includes(current))await loadStudents();if(current==='students'){const {data}=await supabase.from('courses').select('id,course_name').order('course_name');courseCache=data||[];}if(current==='fees'||current==='attendance'){const {data}=await supabase.from('students').select('*').eq('status','Active').order('full_name');students=data||[];}const m=modules[current];$('modalTitle').textContent=(editingId?'Edit ':'Add ')+m.title;$('formFields').innerHTML=m.fields.map(f=>`<div class="field"><label>${esc(f[1])}${(f[3]===1||f[4]===1)?' *':''}</label>${fieldControl(f,record?.[f[0]]??(f[0].endsWith('_date')||f[0]==='admission_date'?today():''))}</div>`).join('');if(current==='fees'){$('f_student_id').onchange=()=>fillStudentFields('fees');}if(current==='attendance')$('f_student_id').onchange=()=>fillStudentFields('attendance');err('formError','');$('modal').classList.add('open');}catch(e){alert(e.message);}}
function fillStudentFields(kind){let s=students.find(x=>String(x.id)===$('f_student_id').value);if(!s)return;}
async function uploadPhoto(file,folder){if(!file)return null;if(file.size>3*1024*1024)throw new Error('Photo 3 MB से छोटी होनी चाहिए।');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${folder}/${crypto.randomUUID()}.${ext}`;const {error}=await supabase.storage.from('institute-photos').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return supabase.storage.from('institute-photos').getPublicUrl(path).data.publicUrl;}
$('recordForm').onsubmit=async e=>{e.preventDefault();const m=modules[current],obj={};try{for(const [key,label,type='text'] of m.fields){if(type==='file')continue;let v=$('f_'+key)?.value??'';if(type==='number')v=v===''?null:Number(v);if(type==='select'&&key==='is_published')v=v==='true';obj[key]=v===''?null:v;}
if(['fees','attendance','certificates','results'].includes(current)&&obj.student_id){const s=students.find(x=>String(x.id)===String(obj.student_id));if(s){obj.student_name=s.full_name;obj.admission_no=s.admission_no;if(current==='fees'&&!obj.receipt_no)obj.receipt_no='SO-'+Date.now();}}
if(current==='students'&&!obj.admission_no)obj.admission_no='SO-'+Date.now();if(current==='staff'&&!obj.employee_id)obj.employee_id='ST-'+Date.now();
if(current==='students'||current==='staff'){const f=$('f_photo').files[0];if(f)obj.photo_url=await uploadPhoto(f,current);}
$('saveBtn').disabled=true;let req=editingId?supabase.from(m.table).update(obj).eq('id',editingId):supabase.from(m.table).insert(obj);const {error}=await req;$('saveBtn').disabled=false;if(error)throw error;closeModal();await render();}catch(ex){$('saveBtn').disabled=false;err('formError',ex.message);}};
async function removeRecord(m,id){if(!confirm('क्या आप यह record delete करना चाहते हैं?'))return;const {error}=await supabase.from(m.table).delete().eq('id',id);if(error)alert(error.message);else render();}
function closeModal(){$('modal').classList.remove('open');$('recordForm').reset();editingId=null;}$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
function printDoc(title,body){const w=window.open('','_blank');if(!w){alert('Popup allow करें, फिर दोबारा कोशिश करें।');return;}w.document.write(`<!doctype html><html><head><title>${esc(title)}</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:24px;color:#172338}.card{border:2px solid #16365c;border-radius:12px;padding:20px;max-width:650px;margin:20px auto}.head{text-align:center;border-bottom:2px solid #16365c;padding-bottom:10px}.head h2{margin:4px}.photo{width:110px;height:130px;object-fit:cover;border:1px solid #999}.row{display:flex;gap:18px;align-items:center;margin:18px 0}.line{padding:7px 0;border-bottom:1px solid #ddd}.btn{margin:12px;padding:10px 18px}@media print{.btn{display:none}body{padding:0}}</style></head><body>${body}<button class="btn" onclick="window.print()">Print / Save PDF</button></body></html>`);w.document.close();}
function studentCard(s){printDoc('Student ID Card',`<div class="card"><div class="head"><h2>${INSTITUTE}</h2><div>${ADDRESS} · ${PHONE}</div><b>STUDENT ID CARD</b></div><div class="row">${s.photo_url?`<img class="photo" src="${esc(s.photo_url)}">`:'<div class="photo"></div>'}<div><h2>${esc(s.full_name)}</h2><div class="line">Admission No: ${esc(s.admission_no)}</div><div class="line">Father: ${esc(s.father_name)}</div><div class="line">Course: ${esc(s.course_id)}</div><div class="line">Mobile: ${esc(s.mobile)}</div><div class="line">Admission: ${esc(s.admission_date)}</div></div></div></div>`);}
function staffCard(s){printDoc('Staff ID Card',`<div class="card"><div class="head"><h2>${INSTITUTE}</h2><div>${ADDRESS} · ${PHONE}</div><b>STAFF ID CARD</b></div><div class="row">${s.photo_url?`<img class="photo" src="${esc(s.photo_url)}">`:'<div class="photo"></div>'}<div><h2>${esc(s.full_name)}</h2><div class="line">Employee ID: ${esc(s.employee_id)}</div><div class="line">Designation: ${esc(s.designation)}</div><div class="line">Department: ${esc(s.department)}</div><div class="line">Mobile: ${esc(s.mobile)}</div><div class="line">Joining: ${esc(s.joining_date)}</div></div></div></div>`);}
function receipt(r){printDoc('Fees Receipt',`<div class="card"><div class="head"><h2>${INSTITUTE}</h2><div>${ADDRESS} · ${PHONE}</div><h3>FEES RECEIPT</h3></div><div class="line">Receipt No: ${esc(r.receipt_no)}</div><div class="line">Student: ${esc(r.student_name)}</div><div class="line">Admission No: ${esc(r.admission_no)}</div><div class="line">Payment Date: ${esc(r.payment_date)}</div><div class="line">Amount Paid: ₹${esc(r.amount)}</div><div class="line">Payment Mode: ${esc(r.payment_mode)}</div><div class="line">Remarks: ${esc(r.remarks)}</div><p style="text-align:right;margin-top:35px">Authorized Signature</p></div>`);}
function exportCSV(m,rows){if(!rows.length){alert('कोई record नहीं है।');return;}const csv=[m.cols.join(','),...rows.map(r=>m.cols.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=m.table+'.csv';a.click();URL.revokeObjectURL(a.href);}
$('loginBtn').onclick=async()=>{err('loginError','');if(!configured){err('loginError','index.html में अपनी Supabase Project URL और Publishable Key भरें।');return;}const {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){err('loginError',error.message);return;}showApp();};$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();$('app').style.display='none';$('login').style.display='grid';};function showApp(){$('login').style.display='none';$('app').style.display='block';supabase.auth.getUser().then(({data})=>$('userLabel').textContent=data.user?.email||'Admin');current='dashboard';render();}if(configured){const {data:{session}}=await supabase.auth.getSession();if(session)showApp();}
</script></body></html>
